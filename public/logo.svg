<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="logoCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C15BFF" />
      <stop offset="50%" stop-color="#8B40FF" />
      <stop offset="100%" stop-color="#588DFF" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E8DCFF" />
      <stop offset="100%" stop-color="#C15BFF" />
    </linearGradient>

    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C15BFF" />
      <stop offset="100%" stop-color="#588DFF" />
    </linearGradient>

    <!-- Filters -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Container -->
  <g transform="translate(20, 10)">
    <!-- Outer Rounded Glass Box -->
    <rect x="0" y="0" width="140" height="140" rx="36" fill="#160C32" stroke="#8B40FF" stroke-width="2.5" opacity="0.95" />
    <rect x="2" y="2" width="136" height="136" rx="34" fill="none" stroke="url(#logoCloudGrad)" stroke-width="1.5" opacity="0.5" />

    <!-- Ambient Glow behind icon -->
    <circle cx="70" cy="70" r="45" fill="url(#logoCloudGrad)" opacity="0.25" filter="url(#logoGlow)" />

    <!-- Cyber Tech Cloud -->
    <path d="M48 85 h44 a18 18 0 0 0 4.5 -35.4 A22.5 22.5 0 0 0 56 42 a18 18 0 0 0 -12.5 21.5 A16 16 0 0 0 48 85 z" fill="url(#logoCloudGrad)" filter="url(#logoGlow)" />

    <!-- Orbital Light Rail -->
    <ellipse cx="70" cy="74" rx="46" ry="18" stroke="url(#orbitGrad)" stroke-width="2.2" stroke-dasharray="8 6" opacity="0.85" transform="rotate(-15 70 74)" />

    <!-- Interconnected Network Nodes -->
    <circle cx="44" cy="64" r="4.5" fill="#FFFFFF" />
    <circle cx="70" cy="50" r="5" fill="#FFFFFF" />
    <circle cx="92" cy="70" r="4.5" fill="#FFFFFF" />
    <circle cx="60" cy="78" r="3.5" fill="#588DFF" />
    <line x1="44" y1="64" x2="70" y2="50" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />
    <line x1="70" y1="50" x2="92" y2="70" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Right Typography -->
  <g transform="translate(190, 30)">
    <!-- Main Chinese Brand Title -->
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="48" font-weight="900" letter-spacing="2" fill="url(#textGrad)">
      灵动云官网
    </text>

    <!-- English Slogan & Sub-branding -->
    <text x="3" y="90" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="16" font-weight="700" letter-spacing="6" fill="#588DFF" opacity="0.95">
      LINGDONGYUN · OFFICIAL WEBSITE
    </text>

    <!-- Tagline Badge -->
    <rect x="0" y="105" width="280" height="24" rx="12" fill="#160C32" stroke="#8B40FF" stroke-width="1.2" opacity="0.9" />
    <text x="14" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#D4C8ED">
      ✨ 灵动星云 · 全球智能连接 | 让网络更自由
    </text>
  </g>
</svg>
