<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C15BFF" />
      <stop offset="50%" stop-color="#8B40FF" />
      <stop offset="100%" stop-color="#588DFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background glow circle -->
  <circle cx="32" cy="32" r="30" fill="#09071C" stroke="url(#favGrad)" stroke-width="2" />
  
  <!-- Cyber Tech Cloud -->
  <path d="M22 38h20a8 8 0 0 0 2-15.7A10 10 0 0 0 25.5 19 8 8 0 0 0 20 28.5 7 7 0 0 0 22 38z" fill="url(#favGrad)" opacity="0.85" filter="url(#glow)" />
  
  <!-- Orbital Light Rail -->
  <ellipse cx="32" cy="34" rx="22" ry="9" stroke="#588DFF" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7" transform="rotate(-15 32 34)" />
  
  <!-- Network Nodes -->
  <circle cx="20" cy="28" r="2.5" fill="#FFFFFF" />
  <circle cx="32" cy="22" r="2.5" fill="#FFFFFF" />
  <circle cx="42" cy="31" r="2.5" fill="#FFFFFF" />
  <circle cx="28" cy="35" r="2" fill="#588DFF" />
  <line x1="20" y1="28" x2="32" y2="22" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />
  <line x1="32" y1="22" x2="42" y2="31" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />
</svg>
